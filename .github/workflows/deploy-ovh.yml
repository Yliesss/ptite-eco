# Envoie automatiquement le site (dossier public) sur l'hébergement OVH à chaque modification.
name: Mise en ligne sur OVH
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Envoi FTP vers OVH (dossier www)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; mirror --reverse --verbose --only-newer --no-perms ./public ./www; bye"
