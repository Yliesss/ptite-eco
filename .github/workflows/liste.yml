name: Liste chiffrée des comptes
on:
  workflow_dispatch:
    inputs:
      clepub:
        description: "Clé publique RSA (PEM, base64) : la liste est chiffrée, rien de lisible dans les journaux"
        required: true
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - name: Lister et chiffrer
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLEPUB: ${{ inputs.clepub }}
        run: |
          echo "$CLE" > $RUNNER_TEMP/cle.json
          export GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cle.json
          npm i firebase-admin@12 --silent --no-audit --no-fund >/dev/null
          cat > l.js <<'JS'
          const a=require("firebase-admin"),c=require("crypto");a.initializeApp({projectId:"mon-porte-monnaie-e3f0a"});
          (async()=>{
            const db=a.firestore(),L=[];let tok;
            do{const r=await a.auth().listUsers(1000,tok);for(const u of r.users){const d=(await db.collection("users").doc(u.uid).get()).data()||{};const p=d.profil||{};
              L.push({email:u.email||"",prenom:p.prenom||"",statut:p.statut||"",cree:u.metadata.creationTime,derniere:u.metadata.lastSignInTime,via:u.providerData.map(x=>x.providerId).join(","),admin:(await db.collection("admins").doc(u.uid).get()).exists})}tok=r.pageToken}while(tok);
            const k=c.randomBytes(32),iv=c.randomBytes(12),ci=c.createCipheriv("aes-256-gcm",k,iv);
            const enc=Buffer.concat([ci.update(JSON.stringify(L)),ci.final()]);
            const pub=Buffer.from(process.env.CLEPUB,"base64").toString();
            const ek=c.publicEncrypt({key:pub,oaepHash:"sha256"},k);
            console.log("CHIFFRE "+[ek,iv,ci.getAuthTag(),enc].map(b=>b.toString("base64")).join("."));
          })().catch(e=>{console.log("ERREUR",e.code);process.exit(1)});
          JS
          node l.js
