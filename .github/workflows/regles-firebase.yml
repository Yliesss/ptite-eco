# Publie automatiquement les règles Firestore quand le fichier firestore.rules change.
name: Règles Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/workflows/regles-firebase.yml]
  workflow_dispatch:
jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clé du compte de service
        run: echo "$CLE" > "$RUNNER_TEMP/cle.json"
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Compte utilisé
        run: python3 -c "import json,os;d=json.load(open(os.environ['RUNNER_TEMP']+'/cle.json'));print('Compte :',d.get('client_email'),'| Projet :',d.get('project_id'))"
      - name: Publier les règles Firestore
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project mon-porte-monnaie-e3f0a --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cle.json
