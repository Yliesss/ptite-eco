<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P'tite Éco</title>
<meta name="description" content="Gère ton budget, tes abonnements et tes courses.">
<meta name="description" content="P'tite Éco : ton budget, tes abonnements, tes courses et un espace étudiant. Petites économies, grande liberté.">
<meta name="theme-color" content="#1d2547">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout : appli mobile claire et colorée, une colonne, onglets fixés en bas, feuilles modales pour la saisie.
   Thème clair par défaut, thème sombre automatique (réglage du téléphone) ou forcé depuis « Mon compte ». */
:root{
  color-scheme:light;
  --bg:#f2f6fc; --surface:#ffffff; --ink:#1d2547; --muted:#6b7395; --line:#e3e8f3; --soft:#f6f8fd;
  --coral:#ff6b57; --sun:#ffb21e; --mint:#16c19a; --sky:#3b8cff; --grape:#8e5cf7; --pink:#ff5fa2;
  --coral-s:#ffe9e5; --sun-s:#fff3d9; --mint-s:#dcf7ef; --sky-s:#e1edff; --grape-s:#eee6ff; --pink-s:#ffe3ef;
  --lidl:#1f56c4; --leclerc:#e2580b;
  --hero:#1d2547; --neg:var(--neg); --pos:var(--pos); --link:var(--link); --grape-t:var(--grape-t); --sun-t:var(--sun-t); --pink-t:var(--pink-t); --nav:rgb(242 246 252/.92);
  --f-display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1424; --surface:#192037; --ink:#e8ecfa; --muted:#9aa3c7; --line:#2a3352; --soft:#20283f;
    --coral-s:#3d2228; --sun-s:#3a2f16; --mint-s:#133a33; --sky-s:#182d52; --grape-s:#2b2249; --pink-s:#3c1d30;
    --hero:#263063; --neg:#ff8b7a; --pos:#5fe0bd; --link:#86b4ff; --grape-t:#c4a9ff; --sun-t:#ffcd6b; --pink-t:#ff9fc8; --nav:rgb(15 20 36/.92);
    color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0f1424; --surface:#192037; --ink:#e8ecfa; --muted:#9aa3c7; --line:#2a3352; --soft:#20283f;
    --coral-s:#3d2228; --sun-s:#3a2f16; --mint-s:#133a33; --sky-s:#182d52; --grape-s:#2b2249; --pink-s:#3c1d30;
    --hero:#263063; --neg:#ff8b7a; --pos:#5fe0bd; --link:#86b4ff; --grape-t:#c4a9ff; --sun-t:#ffcd6b; --pink-t:#ff9fc8; --nav:rgb(15 20 36/.92);
    color-scheme:dark;}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(118px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.6rem}
h2{font-size:1.3rem}
h3{font-size:1.06rem}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgb(29 37 71/.05),0 6px 18px rgb(29 37 71/.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.tile .small{opacity:.85}
.t-coral{background:var(--coral-s);color:var(--neg)}.t-sun{background:var(--sun-s);color:var(--sun-t)}.t-mint{background:var(--mint-s);color:var(--pos)}.t-sky{background:var(--sky-s);color:var(--link)}.t-grape{background:var(--grape-s);color:var(--grape-t)}.t-pink{background:var(--pink-s);color:var(--pink-t)}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:hover{background:var(--soft)}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.ico svg{width:22px;height:22px}
.amt{font-weight:800;white-space:nowrap}
.sub{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.pill{display:inline-block;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--sky);color:#fff;font-size:.95rem}
.btn.coral{background:var(--coral)}.btn.mint{background:var(--mint)}
.btn.ghost{background:var(--sky-s);color:var(--link)}
.btn.danger{background:var(--coral-s);color:var(--neg)}
.btn.sm{padding:8px 12px;font-size:.84rem;border-radius:11px}
.btn.block{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select{font:inherit;font-weight:600;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:13px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--sky);outline:none;background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:700}
.empty{text-align:center;padding:22px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center}
.hero .big{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.05}
.hero .lbl{color:#b9c1e6}
.donut{flex:none;width:118px;height:118px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.8rem}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:10px;height:10px;border-radius:4px;flex:none}
.hbar{height:14px;border-radius:8px;background:var(--soft);overflow:hidden}
.hbar span{display:block;height:100%;border-radius:8px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border-radius:10px;border:0;background:var(--sky-s);color:var(--link);font-weight:800;font-size:1.05rem}
.qty span{min-width:22px;text-align:center;font-weight:800}
.price2{display:flex;gap:8px;font-size:.8rem;white-space:nowrap}
.price2 .w{font-weight:800;text-decoration:underline;text-underline-offset:3px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
nav.tabs button{background:var(--surface);border:0;color:var(--muted);padding:8px 2px;box-shadow:0 1px 2px rgb(29 37 71/.06);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:800;border-radius:14px}
nav.tabs button svg{width:21px;height:21px}
@media (max-width:360px){nav.tabs button{font-size:.62rem}}
nav.tabs.n7 button{font-size:.6rem;padding:8px 0}
nav.tabs.n8{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs.n8::-webkit-scrollbar{display:none}
nav.tabs.n8 button{flex:0 0 64px;font-size:.62rem;padding:8px 0}
@media (max-width:380px){nav.tabs.n7{gap:3px}nav.tabs.n7 button{font-size:.58rem}}
.choix-st{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-weight:800;cursor:pointer;color:var(--ink)}
.choix-st input{position:absolute;opacity:0;pointer-events:none}
.choix-st svg{width:28px;height:28px}
.choix-st:has(input:checked){border-color:var(--grape);background:var(--grape-s);color:var(--grape-t)}
.choix-st:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leaflet-container{font:inherit}
/* ================= Ordinateur : menu à gauche, contenu sur deux colonnes ================= */
aside.side{display:none}
@media (hover:hover){.item:hover,.tuile:hover{filter:brightness(.97)}.btn:hover{filter:brightness(1.06)}}
@media (min-width:1000px){
  nav.bottom{display:none!important}
  #v-commerces .card img,#v-campus .card img{max-height:300px}
  aside.side{display:flex;flex-direction:column;gap:6px;position:fixed;inset:0 auto 0 0;width:260px;z-index:20;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 6px 14px;font:inherit;cursor:pointer;color:var(--ink);text-align:left}
  .side-brand svg{width:44px;height:44px;border-radius:13px;flex:none}
  .side-brand b{font-family:var(--f-display);font-size:1.35rem}
  .side-brand em{font-style:normal;color:var(--coral)}
  .side-ajout{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px;margin-bottom:10px;background:linear-gradient(140deg,#ff8a5c,#ff5f7e);color:#fff;font:inherit;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 8px 20px rgb(255 95 126/.35)}
  .side-ajout svg{width:22px;height:22px;stroke-width:2.6}
  .side-liste{display:flex;flex-direction:column;gap:2px}
  .side-liste button,.side-bas button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:14px;padding:11px 12px;font:inherit;font-weight:800;font-size:.95rem;color:var(--muted);cursor:pointer;text-align:left}
  .side-liste button svg,.side-bas button svg{width:22px;height:22px;flex:none}
  .side-liste button:hover,.side-bas button:hover{background:var(--soft);color:var(--ink)}
  .side-liste button[aria-current="page"]{background:var(--coral-s);color:var(--neg)}
  .side-bas{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 0 0 260px;padding:28px 40px 60px}
  @media (min-width:1500px){.wrap{margin-left:calc(260px + (100vw - 260px - 1180px)/2)}}
  .topbar .brand{display:none}
  .topbar h1{font-size:2rem}
  /* tableaux de bord sur deux colonnes */
  #v-accueil,#v-abos,#v-foyer,#v-etudes,#v-admin,#v-repas,#v-prix{display:block;columns:2;column-gap:22px}
  #v-accueil>*,#v-abos>*,#v-foyer>*,#v-etudes>*,#v-admin>*,#v-repas>*,#v-prix>*{break-inside:avoid;margin-bottom:22px;width:100%}
  #v-accueil>.hero,#v-accueil>.annonce,#v-admin>.kpis,#v-etudes>.mur-lien,#v-prix>.btn,#v-abos>.btn{column-span:all}
  .kpis{grid-template-columns:repeat(4,1fr)}
  /* fils d'actualité : une colonne centrée, plus lisible */
  #v-campus,#v-commerces,#v-courses{max-width:760px}
  /* fenêtres : au centre de l'écran */
  .sheet-bg{align-items:center;padding:24px}
  .sheet{max-width:620px;border-radius:26px;padding:26px 28px;max-height:88vh}
  .tuiles{grid-template-columns:repeat(3,1fr)}
}
/* page de présentation sur grand écran */
@media (min-width:1000px){
  .landing{max-width:1180px!important;display:grid!important;grid-template-columns:1fr 1fr;column-gap:56px;row-gap:22px;align-items:start;padding-top:56px!important}
  .landing>*{grid-column:1}
  .landing>.grid2{grid-column:2;grid-row:1 / span 7;align-self:center}
  .landing h1{font-size:3.4rem!important}
}

/* ---- Navigation du bas ---- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand{border:0;padding:0;background:none;width:44px;height:44px;flex:none;cursor:pointer}
.brand svg{width:44px;height:44px;display:block;border-radius:13px;box-shadow:0 4px 14px rgb(255 95 126/.3)}
.topbar h1{font-size:1.45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
@media (min-width:620px){nav.bottom{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:14px;border-radius:26px;border:1px solid var(--line);box-shadow:0 12px 34px rgb(29 37 71/.16);padding-bottom:6px}}
nav.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:.7rem;font-weight:800;padding:6px 0;border-radius:16px;min-height:54px;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav.bottom button svg{width:25px;height:25px;transition:transform .2s}
nav.bottom button[aria-current="page"]{color:var(--coral)}
nav.bottom button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
nav.bottom button[aria-current="page"]::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--coral);margin-top:-1px}
nav.bottom button[aria-current="page"] span{display:none}
nav.bottom .fab{width:62px;height:62px;min-height:0;border-radius:22px;justify-self:center;background:linear-gradient(140deg,#ff8a5c,#ff5f7e);color:#fff;box-shadow:0 10px 24px rgb(255 95 126/.45);transform:translateY(-16px);padding:0}
nav.bottom .fab svg{width:30px;height:30px;stroke-width:2.6}
nav.bottom .fab:active{transform:translateY(-16px) scale(.94)}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tuile{border:0;border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:5px;font:inherit;cursor:pointer;min-height:112px;transition:transform .12s}
.tuile b{font-size:.98rem;color:var(--ink);line-height:1.2}
.tuile>span:not(.tuile-ico){font-size:.78rem;font-weight:700;opacity:.9;line-height:1.3}
.tuile-ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);margin-bottom:2px}
.tuile-ico svg{width:23px;height:23px}
.tuile:active{transform:scale(.96)}
/* ---- Tutoriel guidé ---- */
#coach{position:fixed;inset:0;z-index:60}
.coach-spot{position:fixed;box-shadow:0 0 0 200vmax rgb(10 14 30/.74);transition:all .55s cubic-bezier(.6,0,.2,1);pointer-events:none}
.coach-spot::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:3px solid #ffc233;animation:co-pulse 1.6s infinite}
@keyframes co-pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.coach-doigt{position:fixed;width:48px;height:48px;transition:left .6s cubic-bezier(.6,0,.2,1),top .6s cubic-bezier(.6,0,.2,1),opacity .3s;pointer-events:none;filter:drop-shadow(0 6px 10px rgb(0 0 0/.35));z-index:2}
.coach-doigt svg{width:100%;height:100%;transform-origin:30% 10%}
.coach-doigt.tape svg{animation:co-tap 1.3s .6s infinite}
@keyframes co-tap{0%,100%{transform:translate(0,0) scale(1)}35%{transform:translate(-3px,-9px) scale(1.06)}55%{transform:translate(0,0) scale(.86)}75%{transform:scale(1)}}
.coach-bulle{position:fixed;background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px rgb(0 0 0/.35);transition:top .55s cubic-bezier(.6,0,.2,1),left .55s cubic-bezier(.6,0,.2,1);z-index:3}
.coach-bulle h3{font-size:1.2rem}
.coach-bulle p{margin:0;line-height:1.5;font-size:.95rem}
/* ---- Questions, annonce, admin ---- */
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix-b{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
.choix-b[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-s);color:var(--neg)}
.annonce{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#8e5cf7,#ff5f7e);color:#fff}
.annonce-ico{width:38px;height:38px;border-radius:12px;background:rgb(255 255 255/.18);display:grid;place-items:center;flex:none}
.annonce-ico svg{width:22px;height:22px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-graph{display:flex;align-items:flex-end;gap:3px;height:110px}
.mini-graph span{flex:1;border-radius:4px 4px 2px 2px;min-width:3px}
/* ---- Le mur ---- */
.chips-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .btn{flex:none}
.post-actions{gap:4px;margin:0 -6px -4px}
.pa{border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;font:inherit;font-weight:800;font-size:.88rem;cursor:pointer}
.pa svg{width:21px;height:21px}
.pa:hover{background:var(--soft)}
.pa.on{color:#ff5f7e}
.pa.on svg{fill:#ff5f7e}
.prix-post{background:var(--coral);color:#fff;font-weight:900;border-radius:12px;padding:5px 12px;font-size:1.05rem}
.g-bande{gap:12px;padding-block:2px 4px}
.g-bulle{flex:none;width:76px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font:inherit;font-size:.74rem;font-weight:800;color:var(--ink);cursor:pointer;position:relative}
.g-bulle>span:last-of-type{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bulle>img,.g-bulle>.ico{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--grape)}
.g-bulle i{position:absolute;top:44px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--mint);border:2px solid var(--surface)}
.g-lien{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.mur-lien{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:12px 14px;background:linear-gradient(120deg,#8e5cf7,#ff5f7e);color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgb(142 92 247/.25)}
.mur-lien:active{transform:scale(.98)}
.mur-ico{width:40px;height:40px;flex:none;border-radius:12px;background:rgb(255 255 255/.2);display:grid;place-items:center}
.mur-ico svg{width:22px;height:22px}
.mur-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mur-txt b{font-size:1rem;line-height:1.2}
.mur-txt span{font-size:.82rem;font-weight:700;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mur-go{width:30px;height:30px;flex:none;border-radius:50%;background:rgb(255 255 255/.2);display:grid;place-items:center}
.mur-go svg{width:18px;height:18px}
.ta{font:inherit;font-weight:600;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:13px;padding:11px 12px;resize:vertical;width:100%}

nav.tabs button[aria-current="page"]{color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(29 37 71/.45);display:flex;align-items:flex-end;justify-content:center}

.cart{position:relative;width:40px;height:40px;border-radius:50%;background:var(--sky-s);color:var(--link);display:grid;place-items:center;border:0}
.cart svg{width:22px;height:22px}
.cart b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-size:.72rem;display:grid;place-items:center;font-family:var(--f-body)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:16px;padding:4px;gap:4px;box-shadow:0 1px 2px rgb(29 37 71/.05)}
.seg button{border:0;border-radius:12px;padding:10px;font-weight:800;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;font-weight:800;font-size:.86rem;border:2px solid var(--line)}
.links a:hover{border-color:var(--sky)}
.links a span{color:var(--muted);font-weight:700}
.chk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--mint)}
.chk.done .grow{text-decoration:line-through;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sun);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;border:0}

.auth-logo svg{width:46px;height:46px;flex:none}
.auth-logo em{font-style:normal;color:var(--coral)}
.err{color:var(--neg);font-size:.86rem;font-weight:700}
.coin{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1.05}

const POLITIQUE=`<h3>Qui est responsable de tes données ?</h3><p>${esc(EDITEUR.nom)}, éditeur de P'tite Éco. Contact : ${esc(EDITEUR.contact)}.</p>
<h3>Quelles données ?</h3><p>Ton prénom, ton adresse e-mail, et ce que tu saisis : sommes reçues, dépenses, abonnements, assurances, magasins, liste de courses et prix. L'adresse e-mail sert à te connecter, à confirmer ton compte et à recevoir le lien « mot de passe oublié » ; aucun autre e-mail ne t'est envoyé. Si tu te connectes avec Google, l'appli reçoit seulement ton nom et ton adresse e-mail. Ton mot de passe est géré par Firebase Authentication (Google) et n'est jamais visible par l'éditeur.</p>
<h3>Pourquoi ?</h3><p>Uniquement pour faire fonctionner l'appli et calculer ton budget. Pas de publicité, pas de revente, pas de profilage, pas d'intelligence artificielle.</p>
<h3>Où sont-elles stockées ?</h3><p>Chez Google Firebase (sous-traitant), sur des serveurs situés dans l'Union européenne. Chaque compte n'a accès qu'à ses propres données.</p>
<h3>Cookies et traceurs</h3><p>Aucun cookie publicitaire ni outil de mesure d'audience. L'appli garde seulement ta connexion sur cet appareil, ce qui est strictement nécessaire au service et ne demande pas de consentement.</p>
<h3>Notifications</h3><p>Si tu les actives, l'appli t'envoie à l'ouverture des rappels sur ton budget (prélèvements, renouvellements, budget dépassé). Elles restent sur ton téléphone et se désactivent dans « Mon compte ».</p>
<h3>Amis et panier partagé</h3><p>Ton prénom et ton code ami sont visibles des autres utilisateurs connectés qui saisissent ton code. Un panier partagé est visible uniquement par les personnes que tu y as ajoutées. Ton budget reste toujours privé.</p>
<h3>À l'inscription</h3><p>On te demande, si tu le veux bien, comment tu as connu l'appli et ce qui t'intéresse. Ces réponses servent seulement à des statistiques globales (combien de personnes viennent de TikTok, par exemple), sans ton nom.</p>
<h3>Ta situation</h3><p>On te demande seulement si tu es étudiant(e) ou en activité, pour afficher les outils utiles. Rien d'autre sur ta vie n'est demandé.</p>
<h3>Espace étudiant et position</h3><p>Ta position n'est utilisée que quand tu touches « Autour de moi » ou « Ma position », après ton accord dans le navigateur. Pour trouver les lieux proches, des coordonnées sont envoyées aux services publics de données de l'enseignement supérieur et de l'IGN, et à OpenStreetMap (carte et arrêts de transport). Ton établissement et ton adresse « Chez moi » sont enregistrés dans ton compte privé et tu peux les effacer à tout moment.</p>
<h3>Le mur du campus</h3><p>Ce que tu publies sur le mur de ton établissement (texte, photo, prix, commentaires) est visible par les utilisateurs connectés, avec ton prénom seulement. Tu peux supprimer tes publications à tout moment. Les publications signalées sont vérifiées et peuvent être supprimées.</p>
<h3>Commerces</h3><p>Une fiche commerce (nom, adresse, photo, description, téléphone) est publiée par le commerçant lui-même et visible par les utilisateurs connectés. Il peut la modifier ou la retirer à tout moment. Les signalements sont anonymes pour le commerçant.</p>
<h3>Prix partagés</h3><p>Quand tu scannes un ticket et laisses la case « Partager » cochée, seuls le produit, l'enseigne, le prix et la date sont envoyés dans une base commune. Ton ticket, ton nom, ton compte et le total de tes achats ne sont jamais partagés.</p>
<h3>Foyer</h3><p>Le budget commun et les dépenses du foyer sont visibles uniquement par les membres de ce foyer. Le reste de ton budget reste privé.</p>
<h3>Import du relevé bancaire</h3><p>Le fichier de ta banque est lu sur ton téléphone. Seules les opérations que tu choisis d'importer sont enregistrées dans ton compte ; le fichier lui-même n'est envoyé nulle part.</p>
<h3>Protection anti-abus</h3><p>Si elle est activée, Google reCAPTCHA vérifie que les requêtes viennent bien de l'appli et pas d'un robot. Ce service peut collecter des informations techniques sur ton navigateur.</p>
<h3>Scan de produits</h3><p>Quand tu scannes un produit, seul son code-barres est envoyé à Open Food Facts (base publique et gratuite) pour récupérer sa fiche. L'image de la caméra reste sur ton téléphone.</p>
<h3>Combien de temps ?</h3><p>Tant que ton compte existe. Quand tu le supprimes, tout est effacé définitivement.</p>
<h3>Tes droits</h3><p>Accès, rectification, effacement, portabilité, opposition : tu peux modifier chaque donnée dans l'appli, télécharger une copie complète et supprimer ton compte depuis « Mon compte ». Tu peux aussi écrire à l'éditeur ou adresser une réclamation à la CNIL (cnil.fr).</p>`;

let scanStream=null,scanTimer=null;
function arreterCamera(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
async function detecteur(){
  if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("ean_13"))return new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]})}catch(e){}}
  // repli : bibliothèque ZXing (iPhone, anciens navigateurs)
  if(!window.ZXing)await new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});
  const r=new ZXing.MultiFormatReader();
  return {detect:async src=>{try{const c=document.createElement("canvas");const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;c.width=w;c.height=h;c.getContext("2d").drawImage(src,0,0,w,h);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));const res=r.decode(bmp);return res?[{rawValue:res.getText()}]:[]}catch(e){return []}}};
}

async function chercherProduit(code){
  const out=a("sc-out");if(!out)return;out.innerHTML=`<div class="note">Recherche du produit ${esc(code)}…</div>`;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}&lc=fr`);
    if(r.status===503||r.status===429)throw {msg:"Trop de recherches d'un coup. Attends une minute et réessaie."};
    const j=await r.json();
    if(j.status!==1||!j.product){out.innerHTML=`<div class="card" style="box-shadow:none;border:2px solid var(--line)"><b>Produit inconnu (${esc(code)})</b><span class="small">Il n'est pas encore dans la base Open Food Facts, qui est remplie par ses utilisateurs. Tu peux l'ajouter avec l'appli gratuite Open Food Facts.</span></div>`;return}
    afficherProduit(code,j.product);
  }catch(e){out.innerHTML=`<div class="err">${esc(e?.msg||"Recherche impossible. Vérifie ta connexion internet.")}</div>`}
}
function verdict(p){
  const n=(p.nutriscore_grade||"").toLowerCase(),nova=+p.nova_group||0;
  if(!"abcde".includes(n)||!n){if(nova===4)return ["À limiter","t-coral","Produit ultra-transformé. Le Nutri-Score n'est pas connu."];return ["Pas assez d'informations","t-sky","Le Nutri-Score de ce produit n'est pas encore calculé."]}
  if((n==="a"||n==="b")&&nova&&nova<=3)return ["Bon choix","t-mint","Bonne qualité nutritionnelle et peu transformé."];
  if(n==="a"||n==="b")return ["Plutôt bon, mais transformé","t-sun","Bonne qualité nutritionnelle, mais produit ultra-transformé (additifs, ingrédients industriels)."];
  if(n==="c")return ["Correct avec modération","t-sun","Qualité nutritionnelle moyenne : à consommer de temps en temps."];
  return ["À limiter","t-coral","Qualité nutritionnelle faible (trop gras, sucré ou salé). Mieux vaut le garder pour une occasion."];
}

      <div class="grow"><h3>${esc(nom)}</h3><span class="sub">${esc([p.brands,p.quantity].filter(Boolean).join(" · "))}</span></div></div>

      <div class="tile" style="background:${NUTRI_COL[n]||"#e3e8f3"};color:${NUTRI_COL[n]?"#fff":"var(--muted)"}"><span class="lbl" style="color:inherit">Nutri-Score</span><b style="font-size:1.8rem">${"abcde".includes(n)&&n?n.toUpperCase():"?"}</b></div>

function totals(){

  const am=(S.achats||[]).filter(x=>duMois(x)&&!x.pro),achats=sum(am,x=>x.montant),achCourses=sum(am.filter(x=>x.cat==="courses"),x=>x.montant);
  const courses=Math.max(budget-achCourses,0); // ce qu'il reste à dépenser du budget courses
  const epargne=sum((S.objectifs||[]).flatMap(o=>o.versements||[]).filter(duMois),v=>v.montant);
  const foyer=maPartFoyer();

}
// prochain prélèvement à partir de la date de début
function prochain(ab){
  const t=today(),d0=new Date(ab.debut+"T00:00:00");if(isNaN(d0))return null;
  if(d0>=t)return d0;
  if(ab.freq==="sem"){const st=nbSem(ab)*7,k=Math.ceil(Math.round((t-d0)/864e5)/st);return new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+k*st)}
  const jour=d0.getDate(),clamp=(y,m)=>new Date(y,m,Math.min(jour,new Date(y,m+1,0).getDate()));
  if(ab.freq==="an"){let d=clamp(t.getFullYear(),d0.getMonth());if(d<t)d=clamp(t.getFullYear()+1,d0.getMonth());return d}
  let d=clamp(t.getFullYear(),t.getMonth());if(d<t)d=clamp(t.getFullYear(),t.getMonth()+1);return d;
}
function nbPaiements(ab){
  const t=today(),d0=new Date(ab.debut+"T00:00:00");if(isNaN(d0)||d0>t)return 0;
  if(ab.freq==="sem")return Math.floor(Math.round((t-d0)/864e5)/(nbSem(ab)*7))+1;
  let m=(t.getFullYear()-d0.getFullYear())*12+(t.getMonth()-d0.getMonth());if(t.getDate()>=d0.getDate())m+=1;
  return ab.freq==="an"?Math.floor((m-1)/12)+1:m;
}

// Notifications du téléphone (version Firebase) : envoyées à l'ouverture de l'appli pour les alertes importantes
async function notifier(){
  try{
    if(!S.notifs||!("Notification" in window)||Notification.permission!=="granted")return;
    const k="pm-notif-"+iso(new Date());if(localStorage.getItem(k))return;
    const fortes=alertes(totals()).filter(x=>x.niv!=="info");if(!fortes.length)return;
    const reg=await navigator.serviceWorker?.ready;
    const titre=fortes.length===1?fortes[0].titre:`${fortes.length} choses à surveiller`;
    const corps=fortes.slice(0,3).map(x=>x.titre).join(" · ");
    if(reg?.showNotification)await reg.showNotification(titre,{body:corps,icon:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"pm-alertes"});
    else new Notification(titre,{body:corps,icon:"icons/icon-192.png"});
    localStorage.setItem(k,"1");
  }catch(e){}
}
async function activerNotifs(){
  if(!("Notification" in window)){toast("Ton navigateur ne gère pas les notifications");return false}
  const r=await Notification.requestPermission();
  if(r!=="granted"){toast("Notifications refusées. Tu peux les autoriser dans les réglages de Chrome.");return false}
  S.notifs=true;persist();toast("Notifications activées");notifier();return true;
}

// ---------- Objectifs d'épargne ----------
function etatObjectif(o){
  const mis=sum(o.versements||[],v=>v.montant),reste=Math.max(o.cible-mis,0),fin=o.date?new Date(o.date+"T00:00:00"):null,td=today();
  if(reste<=0)return {mis,reste,pct:100,fini:true,texte:"Objectif atteint, bravo !"};
  const pct=Math.min(100,mis/o.cible*100);
  if(!fin)return {mis,reste,pct,texte:`Encore ${eur(reste)} à mettre de côté.`};
  const mois=Math.max(1,(fin.getFullYear()-td.getFullYear())*12+fin.getMonth()-td.getMonth()+(fin.getDate()>=td.getDate()?0:-1)+1);
  const parMois=reste/mois,dejaCeMois=sum((o.versements||[]).filter(duMois),v=>v.montant);
  if(fin<td)return {mis,reste,pct,enRetard:true,parMois:reste,texte:`La date est passée : il manque ${eur(reste)}.`};
  // en retard si le rythme actuel (moyenne des versements) ne suffit pas
  const debut=new Date((o.cree||iso(td))+"T00:00:00"),moisEcoules=Math.max(1,(td.getFullYear()-debut.getFullYear())*12+td.getMonth()-debut.getMonth()+1);
  const rythme=mis/moisEcoules,enRetard=moisEcoules>1&&rythme*mois<reste*0.9;
  return {mis,reste,pct,parMois,enRetard,texte:`Mets ${eur(Math.ceil(parMois))} par mois pour y arriver le ${fdate(fin,{day:"numeric",month:"long",year:"numeric"})}.${dejaCeMois?` Déjà ${eur(dejaCeMois)} ce mois.`:""}`};
}
function vObjectifs(){
  const L=S.objectifs||[];
  return `<div class="card"><div class="row between"><h3>Mes objectifs d'épargne</h3><button class="btn ghost sm" data-act="obj-add">+ Ajouter</button></div>
    ${L.length?L.map((o,i)=>{const st=etatObjectif(o),col=st.fini?"var(--mint)":st.enRetard?"var(--sun)":RCOL.map(c=>`var(--${c})`)[(i+2)%6];return `<div class="stack" style="gap:6px;padding:8px 0;border-top:${i?"1px solid var(--line)":"0"}">

}
// ---------- Bilan du mois ----------
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function bilanMois(y,m){
  const dans=d=>{const x=new Date((d||"")+"T00:00:00");return x.getFullYear()===y&&x.getMonth()===m};
  const fin=new Date(y,m+1,0),recu=sum(S.revenus.filter(r=>dans(r.date)&&!r.pro),r=>r.montant);
  const achats=(S.achats||[]).filter(x=>dans(x.date)&&!x.pro),ach=sum(achats,x=>x.montant);
  const abos=sum(S.abos.filter(x=>debutDe(x)<=fin),x=>x.freq==="sem"?occSem(x,new Date(y,m,1),fin)*x.montant:x.freq!=="an"?x.montant:(debutDe(x).getMonth()===m?x.montant:0));
  const fixes=sum(S.depenses,d=>d.montant),ep=sum((S.objectifs||[]).flatMap(o=>o.versements||[]).filter(v=>dans(v.date)),v=>v.montant);
  const parCat={};achats.forEach(x=>{const n=catA(x).nom;parCat[n]=(parCat[n]||0)+Number(x.montant||0)});
  const dep=ach+abos+fixes;return {y,m,recu,ach,abos,fixes,ep,dep,solde:recu-dep-ep,parCat};
}
function derniersMois(n){const t=new Date(),L=[];for(let i=n-1;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);L.push(bilanMois(d.getFullYear(),d.getMonth()))}return L}

    <span class="small">${nouveau?`Solde ${prec.solde>=0?"+":""}${eur(prec.solde)} · touche pour le détail`:"Reçu, dépensé et épargné, mois par mois"}</span></button>`;

function blackFriday(an){const d=new Date(an,10,1);let th=0;while(true){if(d.getDay()===4&&++th===4)break;d.setDate(d.getDate()+1)}d.setDate(d.getDate()+1);return d}
function prochainesPromos(){
  const t=today(),y=t.getFullYear(),ev=[];
  let bf=blackFriday(y);if(bf<t)bf=blackFriday(y+1);ev.push(["Black Friday",bf,"La plus grosse période de promos high-tech de l'année."]);
  let sh=new Date(y,0,14);if(sh<t)sh=new Date(y+1,0,14);ev.push(["Soldes d'hiver",sh,"Début mi-janvier, environ 4 semaines."]);

function capacite(prix){
  const t=totals();if(!prix)return "";
  if(t.reste>=prix)return `Avec ton reste à vivre de ${eur(t.reste)}, tu peux te l'offrir ce mois sans passer dans le rouge.`;

}

function coutRecette(r){let tot=0;for(const [id,q] of Object.entries(r.ing)){const c=cat(id);if(c)tot+=cheap(c)*q}return {tot,pp:tot/(r.portions||4)}}
let ia={busy:false,err:""};
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ");
function chercheRecettes(q){
  const mots=norm(q).split(/\s+/).filter(w=>w.length>1);
  const all=[...S.recettesPerso,...RECETTES];
  if(!mots.length)return all;
  return all.map(r=>{const t=norm(r.nom+" "+(r.alias||"")+" "+Object.keys(r.ing).map(id=>cat(id)?.nom).join(" "));
    const n=mots.filter(w=>t.includes(w)||t.includes(w.replace(/s$/,""))).length;const titre=mots.filter(w=>norm(r.nom+" "+(r.alias||"")).includes(w.replace(/s$/,""))).length;
    return {r,score:n===mots.length?10+titre*5:n?titre*5:0}}).filter(x=>x.score>0).sort((p,q)=>q.score-p.score).map(x=>x.r);
}
const fq=q=>{const r=Math.round(q*4)/4;if(q<.2)return "un peu";const ent=Math.floor(r),fr={0:"",.25:"¼",.5:"½",.75:"¾"}[r-ent];return (ent?ent+(fr?" ":""):"")+fr};
// quantité lisible : grammes, ml ou pièces à partir du format du paquet
function qte(p,q){
  const f=(p.fmt||"").toLowerCase().replace(",","."),m=f.match(/(\d+(?:\.\d+)?)\s*(kg|g|cl|ml|l)\b/),x=f.match(/x\s*(\d+)/);
  if(x&&!/\(/.test(f)){const n=Math.max(1,Math.round(q*+x[1]));return n+" pièce"+(n>1?"s":"")}
  if(m){let v=+m[1]*{kg:1000,g:1,l:1000,cl:10,ml:1}[m[2]]*q;const u=/l$/.test(m[2])?"ml":"g";v=v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);
    return v>=1000?(v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+(u==="g"?" kg":" L"):v+" "+u}
  return fq(q)+(q>=.2?" paquet"+(q>1.25?"s":""):"");
}

const DESSERTS=/crepes|pancake|gateau|riz au lait|pain perdu|tarte aux pommes|salade de fruits/;
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function coutPaquets(agg){return sum(Object.entries(agg),([id,q])=>{const c=cat(id);return c?cheap(c)*Math.ceil(q-1e-9):0})}
function genererMenu(o){
  const k=o.personnes/4,slots=o.jours*o.repas,pool=[...S.recettesPerso,...RECETTES].filter(r=>!DESSERTS.test(norm(r.nom)));
  const agg={},pris=[];let rnd=o.graine||1;const alea=()=>{rnd=(rnd*16807)%2147483647;return rnd/2147483647};
  for(let i=0;i<slots;i++){
    let cand=pool.filter(r=>!pris.includes(r.id));if(!cand.length)cand=pool;
    const base=coutPaquets(agg);
    const notes=cand.map(r=>{const t={...agg};for(const [id,q] of Object.entries(r.ing))t[id]=(t[id]||0)+q*k;return {r,c:coutPaquets(t)-base}}).sort((p,q)=>p.c-q.c);
    const choix=notes[Math.floor(alea()*Math.min(4,notes.length))].r;
    pris.push(choix.id);for(const [id,q] of Object.entries(choix.ing))agg[id]=(agg[id]||0)+q*k;
  }
  return {...o,items:pris,total:coutPaquets(agg),agg,date:iso(new Date())};
}

const MOTS_CLES={pates:"pate|spaghet|penne|fusil|tagliat|coquillet",riz:"riz",semoule:"semoul",farine:"farine",lentilles:"lentil",poischiches:"pois ch",tomates:"tomat.*(conc|pel|puree)|conc",thon:"thon",oeufs:"oeuf|oeufs",lait:"lait(?!.*coco)",beurre:"beurre",creme:"creme",fromage:"rape|emmental|gruyere|fromage",yaourts:"yaourt|yaourts",huile:"huile",poulet:"poulet|filet.*pou",boeuf:"boeuf|hache",pdt:"p.*de.*terre|pdt|pomme de t",oignons:"oignon",ail:"\\bail\\b",carottes:"carott",courgettes:"courgett",bananes:"banane",pommes:"pomme(?! de t)|golden|gala",pain:"pain de mie|mie",poivrons:"poivron",champignons:"champig",salade:"salade|laitue",concombre:"concomb",citrons:"citron",aubergines:"auberg",poireaux:"poireau",epinards:"epinard",haricots_verts:"haricot.*vert",petits_pois:"petit.*pois",mais:"\\bmais\\b",haricots_rouges:"haricot.*rouge",frites:"frite",pate_feuilletee:"feuillet",pate_brisee:"brisee",pate_pizza:"pizza",lasagnes_feuilles:"lasagn",nouilles:"nouille",tortillas:"tortill|wrap",pains_burger:"burger|bun",baguette:"baguet",mozzarella:"mozza",reblochon:"reblo",jambon_dinde:"jambon|dinde.*tr",dinde_allumettes:"allumet",steaks:"steak",merguez:"merguez",cuisses_poulet:"cuisse|pilon",saumon:"saumon",poisson_pane:"pane|colin",crevettes:"crevet",lait_coco:"coco",sauce_soja:"soja",pesto:"pesto",sucre:"sucre",chocolat:"chocol"};
function devinerProduit(txt){const t=norm(txt);for(const [id,re] of Object.entries(MOTS_CLES))if(cat(id)&&new RegExp(re).test(t))return id;
  for(const c of S.catalogue){const w=norm(c.nom).split(" ")[0];if(w.length>3&&t.includes(w))return c.id}return ""}
async function lireTicket(file,onProg){
  await chargerTesseract();
  const res=await Tesseract.recognize(file,"fra",{logger:m=>{if(m.status==="recognizing text"&&onProg)onProg(Math.round(m.progress*100))}});
  const lignes=[],txt=res.data.text||"";let total=null;
  for(const raw of txt.split("\n")){const l=raw.trim();const m=l.match(/^(.*?)[\s.]+(-?\d{1,3}[.,]\d{2})\s*(?:€|eur|e)?\s*[a-z0-9]?$/i);if(!m)continue;

    a("co-n").textContent=`Étape ${i+1} sur ${E.length}`;a("co-t").textContent=e.t;a("co-p").textContent=e.p;
    a("co-dots").innerHTML=E.map((_,k)=>`<span style="width:${k===i?18:6}px;height:6px;border-radius:3px;background:${k===i?"var(--coral)":"var(--line)"};transition:width .3s"></span>`).join("");
    a("tu-p").hidden=!i;a("tu-n").textContent=e.fin?"C'est parti !":"Suivant";
    const W=innerWidth,H=innerHeight,bw=Math.min(380,W-32);bulle.style.width=bw+"px";
    if(!cible){spot.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0;border-radius:50%`;doigt.style.opacity=0;
      bulle.style.left=(W-bw)/2+"px";bulle.style.top=Math.max(20,H/2-bulle.offsetHeight/2)+"px";return}
    const r=cible.getBoundingClientRect(),m=8;
    spot.style.cssText=`left:${r.left-m}px;top:${r.top-m}px;width:${r.width+2*m}px;height:${r.height+2*m}px;border-radius:${e.sel===".hero"?30:22}px`;
    doigt.style.opacity=1;doigt.style.left=(r.left+r.width/2-8)+"px";doigt.style.top=(r.top+r.height/2+(r.height>120?-10:4))+"px";
    doigt.classList.toggle("tape",!!e.tap);
    const enBas=r.top+r.height/2>H/2,bh=bulle.offsetHeight;
    bulle.style.left=Math.min(W-bw-16,Math.max(16,r.left+r.width/2-bw/2))+"px";
    bulle.style.top=(enBas?Math.max(16,r.top-m-bh-56):Math.min(H-bh-16,r.bottom+m+60))+"px";
    // menu à gauche (ordinateur) : la bulle se place à droite de l'élément
    if(r.right<W*.35){bulle.style.left=(r.right+m+70)+"px";bulle.style.top=Math.min(H-bh-16,Math.max(16,r.top+r.height/2-bh/2))+"px";doigt.style.left=(r.right-30)+"px";doigt.style.top=(r.top+Math.min(r.height/2,40))+"px"}
  };
  const fin=()=>{el.remove();removeEventListener("resize",place);if(!S.tutoVu){S.tutoVu=iso(new Date());persist()}};
  a("tu-x").onclick=fin;a("tu-n").onclick=()=>{if(E[i].fin)fin();else{i++;place()}};a("tu-p").onclick=()=>{if(i){i--;place()}};
  addEventListener("resize",place);requestAnimationFrame(()=>requestAnimationFrame(place));
}

// prix/{magasin__produit} : {magasin, produit, prix, date, releves:[{p,d}] (8 max), n, maj}
// Rien sur la personne : ni nom, ni identifiant, ni ticket. Seulement produit, enseigne, prix et date.
const COMM={map:{},depuis:"",unsub:null,t:null};
const prixPartageable=(id,m)=>!!ENSEIGNES[m]&&CATALOGUE_DEFAUT.some(d=>d.id===id);
function chargerCommCache(){try{const c=JSON.parse(localStorage.getItem("pm-comm")||"null");if(c){COMM.map=c.map||{};COMM.depuis=c.depuis||""}}catch(e){}}
function sauverCommCache(){try{localStorage.setItem("pm-comm",JSON.stringify({map:COMM.map,depuis:COMM.depuis}))}catch(e){}}
const joursDepuis=d=>(Date.now()-new Date(d+"T00:00:00"))/864e5;
function comm(id,m){const x=COMM.map[m+"__"+id];return x&&x.p>0&&joursDepuis(x.d)<=120?x:null}
function suivrePrixCommuns(){
  if(COMM.unsub)COMM.unsub();chargerCommCache();
  const f=F();
  COMM.unsub=f.onSnapshot(f.query(f.collection(f.db,"prix"),f.where("maj",">",COMM.depuis||"")),snap=>{
    let ch=0;
    snap.docs.forEach(d=>{const x=d.data();if(!(x.prix>0))return;const k=d.id,o=COMM.map[k];
      if(!o||o.p!==x.prix||o.d!==x.date||o.n!==x.n){COMM.map[k]={p:x.prix,d:x.date,n:x.n||1};ch++}
      if((x.maj||"")>COMM.depuis)COMM.depuis=x.maj});
    if(!ch)return;sauverCommCache();
    clearTimeout(COMM.t);COMM.t=setTimeout(()=>{if(!a("sheet-root")?.innerHTML&&["prix","courses","repas"].includes(tab))render()},400);
  },e=>console.warn("prix partagés",e));
}
function arreterPrixCommuns(){if(COMM.unsub){COMM.unsub();COMM.unsub=null}}
async function envoyerPrixCommuns(m,items,date){
  const f=F();let ok=0;
  for(const {id,p} of items){
    if(!prixPartageable(id,m)||!(p>0&&p<500))continue;
    const ref=f.doc(f.db,"prix",m+"__"+id);
    try{
      await f.runTransaction(f.db,async tx=>{
        const sn=await tx.get(ref),d=sn.exists()?sn.data():null;
        const rel=[...(d?.releves||[]),{p:Math.round(p*100)/100,d:date}].sort((x,y)=>x.d.localeCompare(y.d)).slice(-8);
        const dMax=rel[rel.length-1].d,rec=rel.filter(r=>(new Date(dMax)-new Date(r.d))/864e5<=30).map(r=>r.p).sort((x,y)=>x-y);
        let med=rec[Math.floor(rec.length/2)];
        // garde-fou : un relevé isolé très différent ne remplace pas le prix connu
        if(d?.prix>0&&rec.length<3&&(med>d.prix*2.5||med<d.prix/2.5))med=d.prix;
        tx.set(ref,{magasin:m,produit:id,prix:med,date:dMax,releves:rel,n:(d?.n||0)+1,maj:new Date().toISOString()});
      });ok++;
    }catch(e){console.warn("partage prix",e)}
  }
  return ok;
}

function distKm(a1,o1,a2,o2){const r=Math.PI/180,h=Math.sin((a2-a1)*r/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin((o2-o1)*r/2)**2;return 12742*Math.asin(Math.sqrt(h))}

function geoDe(r){
  for(const v of Object.values(r||{})){
    if(v&&typeof v==="object"&&!Array.isArray(v)&&isFinite(v.lat)&&isFinite(v.lon)&&v.lat!==null)return {lat:+v.lat,lon:+v.lon};
    if(Array.isArray(v)&&v.length===2&&v.every(x=>typeof x==="number"))return {lat:v[0],lon:v[1]};
    if(typeof v==="string"&&/^\s*-?\d+\.\d+\s*,\s*-?\d+\.\d+\s*$/.test(v)){const [la,lo]=v.split(",").map(Number);return {lat:la,lon:lo}}

// ================= Foyer : budget commun + dépenses partagées =================
// foyers/{id} : {nom, proprio, membres, noms, postes:[{id,nom,montant}]}
// foyers/{id}/depenses/{id} : {type:"depense"|"remboursement", nom, montant, par, entre:[uid], a, date}
const FOY={doc:null,deps:[],unsub:null,unsubDeps:null,invits:[],unsubInv:null,id:null};
const foyRef=id=>F().doc(F().db,"foyers",id);
const nomFoy=uid=>uid===moi()?"Toi":((FOY.doc?.noms||{})[uid]||"?");
function arreterFoyer(){if(FOY.unsub)FOY.unsub();if(FOY.unsubDeps)FOY.unsubDeps();FOY.unsub=FOY.unsubDeps=null;FOY.doc=null;FOY.deps=[];FOY.id=null}
function suivreFoyer(){
  arreterFoyer();if(!S.foyerId||!fbUser)return;FOY.id=S.foyerId;
  const f=F();
  FOY.unsub=f.onSnapshot(foyRef(S.foyerId),snap=>{
    if(!snap.exists()||!(snap.data().membres||[]).includes(moi())){arreterFoyer();S.foyerId=null;persist();toast("Tu ne fais plus partie du foyer.");majFoyer();return}
    FOY.doc=snap.data();majFoyer();
  },e=>console.warn("foyer",e));
  FOY.unsubDeps=f.onSnapshot(f.collection(f.db,"foyers",S.foyerId,"depenses"),snap=>{
    FOY.deps=snap.docs.map(d=>({id:d.id,...d.data()}));majFoyer();
  },e=>console.warn("foyer dépenses",e));
}
function suivreInvitsFoyer(){
  if(FOY.unsubInv)FOY.unsubInv();
  FOY.unsubInv=F().onSnapshot(F().query(F().collection(F().db,"foyers"),F().where("membres","array-contains",moi())),snap=>{
    FOY.invits=snap.docs.map(d=>({id:d.id,...d.data()}));majFoyer();
  },e=>console.warn("invitations foyer",e));
}
// ma part des dépenses communes du mois (comptée dans mon reste à vivre)
function maPartFoyer(){
  if(!S.foyerId)return 0;
  return sum(FOY.deps.filter(d=>d.type!=="remboursement"&&duMois(d)&&(d.entre||[]).includes(moi())),d=>(+d.montant||0)/Math.max(1,(d.entre||[]).length));
}
function soldesFoyer(){
  const net={};(FOY.doc?.membres||[]).forEach(m=>net[m]=0);
  for(const d of FOY.deps){const m=+d.montant||0;
    if(d.type==="remboursement"){net[d.par]=(net[d.par]||0)+m;net[d.a]=(net[d.a]||0)-m;continue}
    const e=(d.entre||[]).length?d.entre:[d.par];net[d.par]=(net[d.par]||0)+m;e.forEach(u=>net[u]=(net[u]||0)-m/e.length)}
  // qui doit combien à qui (le moins de virements possible)
  const deb=Object.entries(net).filter(x=>x[1]<-0.005).map(x=>[x[0],-x[1]]).sort((p,q)=>q[1]-p[1]);
  const cre=Object.entries(net).filter(x=>x[1]>0.005).sort((p,q)=>q[1]-p[1]);
  const out=[];let i=0,j=0;
  while(i<deb.length&&j<cre.length){const v=Math.min(deb[i][1],cre[j][1]);out.push({de:deb[i][0],a:cre[j][0],montant:Math.round(v*100)/100});deb[i][1]-=v;cre[j][1]-=v;if(deb[i][1]<0.005)i++;if(cre[j][1]<0.005)j++}
  return {net,out};
}

const MOTS_CAT=[
  ["courses",/lidl|leclerc|carrefour|auchan|intermarche|super u|hyper u|\bu express|aldi|netto|casino|monoprix|franprix|grand frais|picard|biocoop|marche/],
  ["resto",/mcdo|mc donald|burger king|kfc|quick|subway|uber ?eats|deliveroo|just ?eat|restaurant|resto|pizza|kebab|tacos|boulangerie|starbucks|cafe/],
  ["transport",/total|esso|shell|bp |avia|carburant|station|sncf|ouigo|blablacar|star |keolis|uber(?! ?eats)|bolt|peage|parking|vinci|sanef|aprr/],
  ["enligne",/amazon|cdiscount|aliexpress|temu|shein|fnac\.com|zalando|vinted|ebay|paypal/],
  ["hightech",/fnac|darty|boulanger|apple|samsung|back ?market|ldlc/],
  ["sante",/pharmacie|pharma|docteur|medecin|dentiste|opticien|laboratoire|hopital/],
  ["vetements",/kiabi|h&m|zara|primark|decathlon|celio|jules|nike|adidas|foot ?locker|intersport/],
  ["loisirs",/cinema|ugc|pathe|gaumont|fnac spectacle|steam|playstation|xbox|nintendo|bowling|spotify|netflix|deezer|disney/]
];
const devinerCat=lib=>{const t=norm(lib);for(const [c,re] of MOTS_CAT)if(re.test(t))return c;return "autre"};
function lireNombre(v){if(v==null)return NaN;let t=String(v).trim().replace(/[\s  €]/g,"").replace(/^\+/,"");if(!t)return NaN;
  if(/,\d{1,2}$/.test(t))t=t.replace(/\./g,"").replace(",",".");else t=t.replace(/,/g,"");return parseFloat(t)}
function lireDate(v){const t=String(v||"").trim();let m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null}
function decouperCSV(txt){
  const lignes=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());if(!lignes.length)return [];
  const ech=lignes.slice(0,10).join("\n"),sep=[";","\t",","].sort((x,y)=>ech.split(y).length-ech.split(x).length)[0];
  return lignes.map(l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){out.push(cur);cur=""}else cur+=c}out.push(cur);return out.map(x=>x.trim())});
}
function analyserReleve(txt){
  const rows=decouperCSV(txt);
  const hi=rows.findIndex(r=>r.some(c=>/date/i.test(c)));if(hi<0)throw new Error("Je ne trouve pas la ligne des titres (Date, Libellé, Montant…). Exporte le relevé au format CSV depuis ta banque.");
  const h=rows[hi].map(c=>norm(c));
  const col=re=>h.findIndex(c=>re.test(c));
  const cD=col(/date/),cL=[col(/libelle|description|intitule|detail|operation|nature/),col(/libelle/)].find(x=>x>=0)??-1,cM=col(/montant|amount|valeur/),cDb=col(/debit/),cCr=col(/credit/);
  if(cD<0||(cM<0&&cDb<0&&cCr<0))throw new Error("Colonnes Date et Montant introuvables dans ce fichier.");
  const ops=[];
  for(const r of rows.slice(hi+1)){
    const date=lireDate(r[cD]);if(!date)continue;
    let m=cM>=0?lireNombre(r[cM]):NaN;
    if(isNaN(m)){const db=lireNombre(r[cDb]),cr=lireNombre(r[cCr]);m=(isNaN(cr)?0:Math.abs(cr))-(isNaN(db)?0:Math.abs(db))}
    if(!m||isNaN(m))continue;
    const lib=(cL>=0?r[cL]:r.filter((x,i)=>i!==cD&&i!==cM).join(" ")).replace(/\s+/g," ").slice(0,80);
    ops.push({date,lib,montant:Math.round(m*100)/100,cle:`${date}|${m}|${norm(lib).slice(0,30)}`});
  }
  return ops;
}

    <label class="btn block" style="display:flex;justify-content:center;gap:8px;align-items:center">${svg('<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>')}Choisir le fichier CSV<input id="ir-f" type="file" accept=".csv,text/csv,text/plain" hidden></label>
    <div id="ir-out"></div></div></div>`;
  const close=()=>{root.innerHTML="";render()};a("sx").onclick=close;a("sb").onclick=e=>{if(e.target.id==="sb")close()};
  a("ir-f").onchange=async()=>{const f=a("ir-f").files[0];if(!f)return;const out=a("ir-out");
    try{
      const buf=await f.arrayBuffer();let txt=new TextDecoder("utf-8").decode(buf);if(txt.includes("�"))txt=new TextDecoder("windows-1252").decode(buf);
      const deja=new Set(S.importes||[]),ops=analyserReleve(txt).filter(o=>!deja.has(o.cle));

        <div class="list" style="gap:0;max-height:48vh;overflow:auto">${ops.map((o,i)=>`<div style="display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)">
          <input type="checkbox" data-io="${i}" ${o.montant<0||o.montant>0?"checked":""} style="width:20px;height:20px">
          <span style="min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.lib||"Opération")}</span><span class="sub">${fdate(new Date(o.date+"T00:00:00"),{day:"numeric",month:"short"})}${o.montant<0?` · <select data-ic="${i}" style="width:auto;padding:2px 4px;font-size:.78rem">${cats.map(([k,c])=>`<option value="${k}" ${devinerCat(o.lib)===k?"selected":""}>${c.nom}</option>`).join("")}</select>`:" · argent reçu"}</span></span>
          <b style="color:${o.montant<0?"var(--neg)":"var(--pos)"};white-space:nowrap">${o.montant>0?"+":""}${eur(o.montant)}</b></div>`).join("")}</div>
        <button class="btn mint block" id="ir-ok">Importer la sélection</button></div>`;
      a("ir-ok").onclick=()=>{let nd=0,nr=0;S.achats=S.achats||[];S.importes=S.importes||[];
        ops.forEach((o,i)=>{if(!out.querySelector(`[data-io="${i}"]`).checked)return;

          else{S.revenus.push({id:u(),montant:o.montant,nom:o.lib,date:o.date,importe:true});nr++}
          S.importes.push(o.cle)});
        S.importes=S.importes.slice(-3000);persist();root.innerHTML="";render();toast(`${nd} dépense${nd>1?"s":""} et ${nr} rentrée${nr>1?"s":""} importées`)};
    }catch(e){out.innerHTML=`<div class="err">${esc(e.message||"Fichier illisible.")}</div>`}};
}

async function ajouterAmi(code){
  const f=F();code=code.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==6)throw new Error("Le code ami fait 6 caractères.");
  if(code===profil.code)throw new Error("C'est ton propre code.");
  const r=await f.getDocs(f.query(f.collection(f.db,"profils"),f.where("code","==",code),f.limit(1)));
  if(r.empty)throw new Error("Aucun compte avec ce code.");
  const autre=r.docs[0];const uid=moi(),id=[uid,autre.id].sort().join("_");
  if(SOC.amities.some(x=>x.id===id))throw new Error("Vous êtes déjà amis, ou une demande est en cours.");
  await f.setDoc(f.doc(f.db,"amities",id),{membres:[uid,autre.id],de:uid,a:autre.id,noms:{[uid]:profil.prenom,[autre.id]:autre.data().prenom||"Ami"},statut:"attente",cree:new Date().toISOString()});
  return autre.data().prenom||"cette personne";
}

// ---------- Panier partagé ----------
// paniers/{id} : {proprio, membres:[uid], noms:{uid:prénom}, liste:{produit:qté}, coches:{produit:prénom}, infos:{produit:{nom,fmt,ref,prix}}}
// Quand S.panierId est défini, le panier (S.liste + S.coches) est synchronisé en direct avec les autres membres.
const PAN={unsub:null,remote:null,doc:null,invits:[],unsubInv:null};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const panRef=id=>F().doc(F().db,"paniers",id);
function infoProduit(id){const c=cat(id);return c?{nom:c.nom,fmt:c.fmt||"",ref:c.ref||{},prix:c.prix||{}}:null}
// envoie au panier partagé uniquement ce qui a changé (article par article : pas d'écrasement si deux personnes modifient en même temps)
function syncPanier(){
  if(!S.panierId||!PAN.remote||!fbUser)return;
  const f=F(),up={},R=PAN.remote;S.coches=S.coches||{};
  for(const k of new Set([...Object.keys(S.liste||{}),...Object.keys(R.liste||{})])){
    const v=S.liste[k]>0?S.liste[k]:null,rv=R.liste[k]>0?R.liste[k]:null;
    if(v!==rv){up["liste."+k]=v==null?f.deleteField():v;if(v!=null&&!(R.infos||{})[k]){const i=infoProduit(k);if(i)up["infos."+k]=i}}
  }
  for(const k of new Set([...Object.keys(S.coches),...Object.keys(R.coches||{})])){
    const v=S.coches[k]||null,rv=(R.coches||{})[k]||null;
    if(!!v!==!!rv)up["coches."+k]=v?(typeof v==="string"?v:profil.prenom):f.deleteField();
  }
  if(!Object.keys(up).length)return;
  up.maj=new Date().toISOString();
  PAN.remote={...R,liste:clone(S.liste),coches:clone(S.coches)};
  f.updateDoc(panRef(S.panierId),up).catch(e=>toast("Panier partagé : "+errFr(e)));
}
function appliquerPanierDistant(d){
  PAN.doc=d;PAN.remote={liste:clone(d.liste),coches:clone(d.coches),infos:clone(d.infos)};
  // produits inconnus de mon catalogue (ajoutés par l'autre personne)
  for(const [id,i] of Object.entries(d.infos||{}))if(!cat(id)&&i)S.catalogue.push({id,nom:i.nom,fmt:i.fmt,ref:i.ref||{},prix:i.prix||{}});
  S.liste=clone(d.liste);S.coches=clone(d.coches);
  if(a("pan-sheet"))panierSheet();
  else if(!a("sheet-root")?.innerHTML&&["courses","repas","prix"].includes(tab))render();
  else majPanier();
}
function suivrePanier(){
  if(PAN.unsub){PAN.unsub();PAN.unsub=null}PAN.remote=null;PAN.doc=null;PAN.id=S.panierId||null;
  if(!S.panierId)return;
  PAN.unsub=F().onSnapshot(panRef(S.panierId),snap=>{
    if(!snap.exists()||!(snap.data().membres||[]).includes(moi())){quitterPanierLocal("Le panier partagé a été arrêté.");return}
    if(snap.metadata.hasPendingWrites&&PAN.remote)return;
    appliquerPanierDistant(snap.data());
  },e=>{console.warn("panier",e)});
}
function quitterPanierLocal(msg){
  if(PAN.unsub){PAN.unsub();PAN.unsub=null}
  const garde=PAN.remote?clone(PAN.remote.liste):clone(S.liste);
  S.panierId=null;PAN.remote=null;PAN.doc=null;PAN.id=null;S.liste=garde;S.coches={};persist();
  if(msg)toast(msg);if(a("pan-sheet"))panierSheet();else render();
}
function suivreInvitations(){
  if(PAN.unsubInv)PAN.unsubInv();
  PAN.unsubInv=F().onSnapshot(F().query(F().collection(F().db,"paniers"),F().where("membres","array-contains",moi())),snap=>{
    PAN.invits=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.id!==S.panierId);
    majPanier();if(a("pan-sheet"))panierSheet();
    if(tab==="courses"&&sousOnglet==="partage")majSocial();
  },e=>console.warn("invitations",e));
}
async function partagerPanier(uids,noms){
  const f=F();
  if(S.panierId){await f.updateDoc(panRef(S.panierId),{membres:f.arrayUnion(...uids),...Object.fromEntries(Object.entries(noms).map(([k,v])=>["noms."+k,v]))});return}
  const infos={};Object.keys(S.liste||{}).forEach(id=>{const i=infoProduit(id);if(i&&!CATALOGUE_DEFAUT.some(d=>d.id===id))infos[id]=i});
  const r=await f.addDoc(f.collection(f.db,"paniers"),{proprio:moi(),membres:[moi(),...uids],noms:{[moi()]:profil.prenom,...noms},liste:clone(S.liste),coches:clone(S.coches),infos,cree:new Date().toISOString(),maj:new Date().toISOString()});
  S.panierId=r.id;persist();suivrePanier();
}
async function rejoindrePanier(p){
  const f=F(),ancien=S.panierId;
  if(PAN.unsub){PAN.unsub();PAN.unsub=null}
  // mes articles actuels rejoignent le panier commun
  const up={},infos={};
  for(const [id,q] of Object.entries(S.liste||{}))if(q>0){up["liste."+id]=Math.max(q,(p.liste||{})[id]||0);const i=infoProduit(id);if(i&&!CATALOGUE_DEFAUT.some(d=>d.id===id))up["infos."+id]=i}
  if(Object.keys(up).length)await f.updateDoc(panRef(p.id),up);
  S.panierId=p.id;S.coches={};suivrePanier();persist();
  if(ancien){try{await f.updateDoc(panRef(ancien),{membres:f.arrayRemove(moi())})}catch(e){}}
  PAN.invits=PAN.invits.filter(x=>x.id!==p.id);if(a("pan-sheet"))panierSheet();
  toast("Tu partages maintenant le panier de "+((p.noms||{})[p.proprio]||"ton proche"));
}
function nomsPanier(){const d=PAN.doc;if(!d)return [];return d.membres.filter(m=>m!==moi()).map(m=>(d.noms||{})[m]||"?")}

    <span class="small">Les personnes ajoutées voient le même panier que toi : quand l'une coche ou ajoute un article, c'est mis à jour chez tout le monde en direct.</span>
    ${d?`<span class="lbl">Partagé avec</span><div>${nomsPanier().map(n=>`<div class="row" style="gap:10px;padding:5px 0"><span class="ico t-mint" style="width:32px;height:32px">${esc(n[0]?.toUpperCase()||"?")}</span>${esc(n)}</div>`).join("")||`<span class="small muted">En attente que tes invités rejoignent le panier.</span>`}</div>`:""}
    <span class="lbl">Ajouter une personne</span>
    ${A.length?A.filter(x=>!deja.includes(x.uid)).map(x=>`<label class="row" style="gap:10px;padding:6px 0"><input type="checkbox" data-pa="${x.uid}" data-nom="${esc(x.nom)}" style="width:22px;height:22px">${esc(x.nom)}</label>`).join("")||`<span class="small muted">Tous tes amis sont déjà dans ce panier.</span>`
      :`<span class="small muted">Ajoute d'abord ta femme ou tes proches en amis : Courses → Amis, avec votre code ami.</span><button class="btn ghost block" id="pp-amis">Aller à mes amis</button>`}
    <div class="err" id="pp-err"></div>
    ${A.some(x=>!deja.includes(x.uid))?`<button class="btn mint block" id="pp-ok">Partager le panier</button>`:""}
    ${d?(d.proprio===moi()?`<button class="btn danger block" id="pp-stop">Arrêter le partage</button>`:`<button class="btn danger block" id="pp-quit">Quitter ce panier partagé</button>`):""}
  </div></div>`;
  const close=()=>{root.innerHTML="";panierSheet()};
  a("sx").onclick=close;a("sb").onclick=e=>{if(e.target.id==="sb")close()};
  if(a("pp-amis"))a("pp-amis").onclick=()=>{root.innerHTML="";sousOnglet="partage";show("courses")};
  if(a("pp-ok"))a("pp-ok").onclick=async()=>{const sel=[...root.querySelectorAll("[data-pa]:checked")];if(!sel.length){a("pp-err").textContent="Coche au moins une personne.";return}
    const noms={};sel.forEach(c=>noms[c.dataset.pa]=c.dataset.nom);
    try{await partagerPanier(sel.map(c=>c.dataset.pa),noms);toast("Panier partagé. L'invitation apparaît dans leur panier.");close()}catch(x){a("pp-err").textContent="Partage impossible : "+errFr(x)}};
  if(a("pp-quit"))a("pp-quit").onclick=async()=>{try{await F().updateDoc(panRef(S.panierId),{membres:F().arrayRemove(moi())})}catch(x){}quitterPanierLocal("Tu as quitté le panier partagé. Tu gardes une copie des articles.");root.innerHTML="";panierSheet()};
  if(a("pp-stop"))a("pp-stop").onclick=async e=>{const b=e.currentTarget;if(!b.dataset.ok){b.dataset.ok=1;b.textContent="Confirmer : chacun retrouve un panier perso";return}
    const id=S.panierId;quitterPanierLocal("Partage arrêté. Tu gardes les articles.");try{await F().deleteDoc(panRef(id))}catch(x){}root.innerHTML="";panierSheet()};
}
function bandeauPanierHtml(){
  const inv=PAN.invits.filter(x=>x.id!==S.panierId);
  return `${inv.map(p=>`<div class="tile t-grape"><b style="font-size:1rem">${esc((p.noms||{})[p.proprio]||"Quelqu'un")} partage son panier avec toi</b><span class="small">En le rejoignant, vous aurez la même liste, cochée en direct. Tes articles actuels y seront ajoutés.</span><div class="row"><button class="btn ghost sm" data-pinv-non="${p.id}">Refuser</button><button class="btn sm" style="background:var(--grape)" data-pinv-oui="${p.id}">Rejoindre</button></div></div>`).join("")}
  <div class="row between" style="gap:8px">${S.panierId?`<span class="pill t-mint">${svg('<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 2 6 5"/>').replace("<svg ",'<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px" ')}Partagé avec ${esc(nomsPanier().join(", ")||"…")}</span>`:`<span class="small muted">Panier perso</span>`}<button class="btn ghost sm" id="p-share">${S.panierId?"Gérer":"Partager"}</button></div>`;
}
function brancherBandeauPanier(root){
  if(a("p-share"))a("p-share").onclick=partagePanierSheet;
  root.querySelectorAll("[data-pinv-oui]").forEach(b=>b.onclick=async()=>{const p=PAN.invits.find(x=>x.id===b.dataset.pinvOui);if(!p)return;try{await rejoindrePanier(p)}catch(x){toast(errFr(x))}});
  root.querySelectorAll("[data-pinv-non]").forEach(b=>b.onclick=()=>F().updateDoc(panRef(b.dataset.pinvNon),{membres:F().arrayRemove(moi())}).then(()=>toast("Invitation refusée")).catch(x=>toast(errFr(x))));
}

// Écran d'erreur avec une vraie raison et une sortie (réessayer / se déconnecter)
function erreurChargement(e){
  const code=e?.code||"";
  const raison=code==="permission-denied"
    ?"La base de données refuse l'accès. L'administrateur de l'appli doit publier les règles de sécurité Firestore (Console Firebase → Firestore → Règles)."
    :code==="unavailable"||code==="failed-precondition"
    ?"Le serveur de données est injoignable. Vérifie ta connexion internet."
    :code==="not-found"
    ?"La base de données Firestore n'existe pas encore dans le projet Firebase."
    :"Une erreur est survenue en chargeant ton compte.";
  document.getElementById("app").innerHTML=`<div class="auth">
    <h2>Connexion impossible</h2>
    <p class="muted" style="margin:0">${esc(raison)}</p>
    ${code?`<p class="sub" style="margin:0">Code : ${esc(code)}</p>`:""}
    <button class="btn block" id="e-retry">Réessayer</button>
    <button class="btn ghost block" id="e-out">Se déconnecter</button>
  </div>`;
  a("e-retry").onclick=()=>location.reload();
  a("e-out").onclick=()=>{setUnlocked(false);window.FB.signOut(window.FB.auth)};
}
function demarrer(){
  window.FB.onAuthStateChanged(window.FB.auth,async user=>{
    fbUser=user;
    if(!user){arreterTempsReel();profil=null;S=VIDE();let deja=false;try{deja=localStorage.getItem("pm-a-compte")==="1"}catch(e){}deja?screenLogin():screenPresentation();return}
    document.getElementById("app").innerHTML=`<div class="auth"><p class="muted">Chargement de ton compte…</p></div>`;
    let data=null;
    try{data=await loadDoc(user.uid)}catch(e){erreurChargement(e);return}
    try{localStorage.setItem("pm-a-compte","1")}catch(e){}
    if(data?.profil){profil=data.profil;try{S={...VIDE(),...JSON.parse(data.state||"{}")};migrer()}catch(e){S=VIDE()}}
    else if(!nouveauProfil&&estGoogle()){screenBienvenueGoogle(user);return}
    else{profil=nouveauProfil||{prenom:(user.email||"?").split("@")[0],cree:iso(new Date()),rgpd:new Date().toISOString()};profil.nouveau=true;S=VIDE();nouveauProfil=null;if(profil.statut==="etudiant")tab="etudes";setUnlocked(true);persist()}
    // ancienne empreinte (enregistrée sur l'ancien site) : plus utilisable ici, on propose de la réactiver
    if(profil.bio&&!bioId()){delete profil.bio;persist();setTimeout(()=>toast("Réactive l'empreinte dans Mon compte : elle était liée à l'ancienne adresse du site"),2500)}
    if(bioId()&&!isUnlocked())screenLock();else{setUnlocked(true);startApp()}
    demarrerTempsReel();
    setTimeout(notifier,1500);
  });
}
if(window.FB)demarrer();else window.addEventListener("fb-ready",demarrer,{once:true});
setTimeout(()=>{if(!window.FB)document.getElementById("app").innerHTML=`<div class="auth"><h2>Chargement impossible</h2><p class="muted">Vérifie ta connexion internet puis recharge la page.</p></div>`},15000);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,reauthenticateWithCredential,EmailAuthProvider,updatePassword,deleteUser,sendEmailVerification,GoogleAuthProvider,signInWithPopup,reauthenticateWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,setDoc,deleteDoc,collection,query,where,limit,onSnapshot,addDoc,updateDoc,getDocs,writeBatch,arrayUnion,arrayRemove,deleteField,runTransaction,getCountFromServer,orderBy,collectionGroup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as CFG from "./firebase-config.js";
const app=initializeApp(CFG.firebaseConfig);
// Protection anti-abus : active seulement si une clé reCAPTCHA v3 est renseignée dans firebase-config.js
if(CFG.appCheckSiteKey){try{const m=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js");m.initializeAppCheck(app,{provider:new m.ReCaptchaV3Provider(CFG.appCheckSiteKey),isTokenAutoRefreshEnabled:true})}catch(e){console.warn("App Check",e)}}
const auth=getAuth(app);auth.languageCode="fr";
const db=initializeFirestore(app,{localCache:persistentLocalCache()});
window.FB={auth,db,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,reauthenticateWithCredential,EmailAuthProvider,updatePassword,deleteUser,sendEmailVerification,GoogleAuthProvider,signInWithPopup,reauthenticateWithPopup,doc,getDoc,setDoc,deleteDoc,collection,query,where,limit,onSnapshot,addDoc,updateDoc,getDocs,writeBatch,arrayUnion,arrayRemove,deleteField,runTransaction,getCountFromServer,orderBy,collectionGroup};
window.dispatchEvent(new Event("fb-ready"));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
